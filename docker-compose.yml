version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: gestao_ocorrencias_db
    restart: no
    environment:
      POSTGRES_DB: ocorrenciasdb
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: