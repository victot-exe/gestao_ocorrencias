spring.application.name=gestao_ocorrencias-tests

spring.datasource.url=jdbc:postgresql://localhost:5432/ocorrenciasdb
spring.datasource.username=sa
spring.datasource.password=postgrespassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=minha-chave-secreta-padrao-para-testes-de-seguranca-1234567890123456
